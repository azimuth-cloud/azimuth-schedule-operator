[project]
name = "azimuth-schedule-operator"
dynamic = ["version"]
requires-python = ">=3.12"
authors = [
	{name = "John Garbutt"}
]
maintainers = [
	{name = "Alex Manning", email = "alexm@stackhpc.com"},
]
readme = "README.md"
license = "Apache-2.0"

dependencies = [
    "aiohttp>=3.14.3",
    "easykube>=0.6.0",
    "kopf>=1.44.6",
    "pydantic>=2.13.5, < 3",
    "python-dateutil>=2.9.0.post0",
    "kube-custom-resource>=0.7.2",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "codespell>=2.4.3",
    "coverage>=7.16.2",
    "freezegun>=1.5.5",
    "oslotest>=6.1.1",
    "ruff>=0.16.10",
    "stestr>=4.2.1",
    "tox>=4.64.7",
    "tox-uv>=1.36.1",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.1+unknown"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # flake8-builtins
    "A",
    # Ruff rules
    "RUF",
    # flake8-async
    "ASYNC",
    # pyupgrade
    "UP",
    # tidy imports
    "TID",
    # sorted imports
    "I",
    # check complexity
    "C90",
    # pep8 naming
    "N",
]
ignore = [
    "UP038", # deprecated
    "F403",
    "A001",
    "A002", # causes errors
    "UP017", # remove and fix once 3.10 not being tested in CI
]

[tool.mypy]
follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.ruff.lint.mccabe]
# Flag errors (`C901`) whenever the complexity level exceeds 5.
max-complexity = 14
