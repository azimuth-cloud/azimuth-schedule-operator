name: Publish charts

on:
  workflow_call:
    inputs:
      ref:
        type: string
        description: The ref to build.
        required: true
    outputs:
      chart-version:
        description: The chart version that was published
        value: ${{ jobs.publish_charts.outputs.chart-version }}

jobs:
  publish_charts:
    name: Publish Helm charts to Quay
    runs-on: ubuntu-latest
    outputs:
      chart-version: ${{ steps.semver.outputs.version }}
    permissions:
      contents: read
      id-token: write
      packages: none
      security-events: none
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          # This is important for the semver action to work correctly
          # when determining the number of commits since the last tag
          fetch-depth: 0

      - name: Get SemVer version for current commit
        id: semver
        uses: azimuth-cloud/github-actions/semver@master

      - name: Publish Helm charts
        uses: azimuth-cloud/github-actions/helm-publish-oci@master
        with:
          directory: charts/operator
          username: ${{ secrets.QUAY_IO_USER }}
          token: ${{secrets.QUAY_IO_TOKEN}}
          registry: quay.io
          repository: azimuth/azimuth-schedule-operator-charts
          version: ${{ steps.semver.outputs.version }}
          app-version: ${{ steps.semver.outputs.short-sha }}

      - name: Publish artifact metadata
        uses: azimuth-cloud/github-actions/artifacthub-metadata@master
        with:
          directory: charts/operator
          registry: quay.io
          repository: azimuth/azimuth-schedule-operator-charts
          username: ${{ secrets.QUAY_IO_USER }}
          token: ${{ secrets.QUAY_IO_TOKEN }}
